<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DU B-Unit Admission Model Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #1e293b; padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Admin Section */
    .admin-panel { background: #fff; border: 2px dashed #94a3b8; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
    .admin-panel textarea { width: 100%; height: 160px; font-family: monospace; font-size: 13px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    
    /* Header & Timer */
    .header { position: sticky; top: 10px; background: white; padding: 12px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 18px; z-index: 10; }
    .timer { font-size: 1.15rem; font-weight: 700; color: var(--danger); background: #fee2e2; padding: 6px 14px; border-radius: 6px; }
    
    /* Question Card */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .subject-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
    .q-text { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
    
    .options { display: grid; gap: 8px; }
    .option-label { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .option-label:hover { background: #f1f5f9; }
    
    .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; font-size: 1.1rem; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    
    /* Results */
    #resultView { display: none; background: white; padding: 25px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
    .score-circle { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 15px 0; }
    .stats { display: flex; justify-content: space-around; margin-top: 15px; }
    .stat-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; font-weight: 600; }
    
    /* Answer review */
    .review-item { text-align: left; margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    .correct-ans { background: #dcfce7; color: #166534; }
    .wrong-ans { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">

  <!-- ADMIN / CREATOR PANEL (Can be hidden during exam) -->
  <div class="admin-panel" id="adminPanel">
    <h3>⚙️ Question Control Panel</h3>
    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">
      Paste your copied questions below. Use this exact syntax for each question:
    </p>
    <textarea id="rawInput" placeholder="Subject: Bangla
Q: Question text here?
A) First Option
B) Second Option
C) Third Option
D) Fourth Option
Ans: A"></textarea>
    
    <div class="btn-row">
      <button class="btn btn-primary" onclick="parseAndSaveQuestions()">Load & Save Questions</button>
      <button class="btn btn-secondary" onclick="toggleAdmin()">Hide Admin Panel</button>
    </div>
  </div>

  <!-- EXAM VIEW -->
  <div class="header">
    <div>
      <h2 style="font-size: 1.1rem;">DU B-Unit Model Test</h2>
      <small style="color: #64748b;">Negative marking: -0.25 per wrong answer</small>
    </div>
    <div class="timer" id="timerBox">Time: 60:00</div>
  </div>

  <form id="examForm">
    <div id="questionsList"></div>
    <button type="button" class="submit-btn" onclick="evaluateExam()">Submit Exam</button>
  </form>

  <!-- RESULT & DETAILED REVIEW -->
  <div id="resultView">
    <h2>Exam Result</h2>
    <div class="score-circle" id="scoreDisplay">0.00</div>
    <div class="stats">
      <div class="stat-box" style="color: var(--success);" id="correctCount">Correct: 0</div>
      <div class="stat-box" style="color: var(--danger);" id="wrongCount">Wrong: 0</div>
      <div class="stat-box" style="color: #64748b;" id="skippedCount">Skipped: 0</div>
    </div>

    <h3 style="margin-top: 30px; text-align: left;">Detailed Review:</h3>
    <div id="reviewContainer"></div>
  </div>

</div>

<script>
  // Negative marking deduction
  const NEGATIVE_MARK = 0.25;
  let parsedQuestions = [];
  let timerInterval = null;
  let totalSeconds = 60 * 60; // 60 minutes

  // Sample default data
  const sampleData = `Subject: Bangla
Q: ‘অপরিচিতা’ গল্পে অনুপমের বাবার পেশা কী ছিল?
A) উকিল
B) ডাক্তার
C) শিক্ষক
D) ব্যবসায়ী
Ans: A

Subject: English
Q: What is the antonym of 'Fragile'?
A) Delicate
B) Sturdy
C) Weak
D) Brittle
Ans: B

Subject: General Knowledge
Q: The headquarters of the United Nations is located in:
A) Geneva
B) London
C) New York
D) Paris
Ans: C`;

  // Initialize
  window.onload = function() {
    const saved = localStorage.getItem("examQuestions") || sampleData;
    document.getElementById("rawInput").value = saved;
    loadExamFromText(saved);
    startTimer();
  };

  function toggleAdmin() {
    const panel = document.getElementById("adminPanel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
  }

  // Parse copied text into structured array
  function parseAndSaveQuestions() {
    const text = document.getElementById("rawInput").value;
    localStorage.setItem("examQuestions", text);
    loadExamFromText(text);
    alert("Exam questions loaded successfully!");
    location.reload();
  }

  function loadExamFromText(rawText) {
    parsedQuestions = [];
    // Split questions by double newline
    const blocks = rawText.trim().split(/\n\s*\n/);

    blocks.forEach((block, idx) => {
      const lines = block.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      let subject = "General";
      let question = "";
      let options = [];
      let answer = "";

      lines.forEach(line => {
        if (line.toLowerCase().startsWith("subject:")) {
          subject = line.replace(/subject:/i, "").trim();
        } else if (line.toLowerCase().startsWith("q:")) {
          question = line.replace(/q:/i, "").trim();
        } else if (/^[A-D]\)/i.test(line)) {
          options.push(line);
        } else if (line.toLowerCase().startsWith("ans:")) {
          answer = line.replace(/ans:/i, "").trim().toUpperCase();
        }
      });

      if (question && options.length > 0 && answer) {
        parsedQuestions.push({
          id: idx,
          subject: subject,
          question: question,
          options: options,
          correctAnswer: answer // e.g. "A", "B", "C", or "D"
        });
      }
    });

    renderExam();
  }

  function renderExam() {
    const container = document.getElementById("questionsList");
    container.innerHTML = "";

    parsedQuestions.forEach((q, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="subject-tag">${q.subject}</div>
        <div class="q-text">${idx + 1}. ${q.question}</div>
        <div class="options">
          ${q.options.map(opt => {
            const letter = opt.charAt(0).toUpperCase();
            return `
              <label class="option-label">
                <input type="radio" name="q_${idx}" value="${letter}">
                <span>${opt}</span>
              </label>
            `;
          }).join("")}
        </div>
      `;
      container.appendChild(card);
    });
  }

  function startTimer() {
    const timerElem = document.getElementById("timerBox");
    timerInterval = setInterval(() => {
      totalSeconds--;
      let m = Math.floor(totalSeconds / 60);
      let s = totalSeconds % 60;
      timerElem.innerText = `Time: ${m}:${s < 10 ? '0' : ''}${s}`;

      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        alert("Time is up! Submitting exam.");
        evaluateExam();
      }
    }, 1000);
  }

  function evaluateExam() {
    clearInterval(timerInterval);

    let correct = 0;
    let wrong = 0;
    let skipped = 0;
    let reviewHTML = "";

    parsedQuestions.forEach((q, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      
      if (!selected) {
        skipped++;
        reviewHTML += `
          <div class="review-item" style="background: #f1f5f9;">
            <strong>${idx + 1}. ${q.question}</strong><br>
            <em>You skipped this.</em> Correct Answer: <strong>${q.correctAnswer}</strong>
          </div>
        `;
      } else if (selected.value === q.correctAnswer) {
        correct++;
        reviewHTML += `
          <div class="review-item correct-ans">
            <strong>${idx + 1}. ${q.question}</strong><br>
            Your Answer: ${selected.value} (Correct, +1.0)
          </div>
        `;
      } else {
        wrong++;
        reviewHTML += `
          <div class="review-item wrong-ans">
            <strong>${idx + 1}. ${q.question}</strong><br>
            Your Answer: ${selected.value} (Wrong, -0.25) | Correct Answer: <strong>${q.correctAnswer}</strong>
          </div>
        `;
      }
    });

    const finalScore = (correct * 1.0) - (wrong * NEGATIVE_MARK);

    // Show Results
    document.getElementById("examForm").style.display = "none";
    document.getElementById("adminPanel").style.display = "none";
    const resView = document.getElementById("resultView");
    resView.style.display = "block";

    document.getElementById("scoreDisplay").innerText = `${finalScore.toFixed(2)} / ${parsedQuestions.length}`;
    document.getElementById("correctCount").innerText = `Correct: ${correct}`;
    document.getElementById("wrongCount").innerText = `Wrong: ${wrong}`;
    document.getElementById("skippedCount").innerText = `Skipped: ${skipped}`;
    document.getElementById("reviewContainer").innerHTML = reviewHTML;
  }
</script>

</body>
</html>
